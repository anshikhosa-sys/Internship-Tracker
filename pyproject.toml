[project]
name = "jobrank"
version = "2.0.0"
description = "Local recruiting platform: parse a résumé, derive a profile, rank job postings, and measure the ranking."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "requests>=2.32",
    "Flask>=3.0",
    "pypdf>=5.0",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40", "pycodestyle>=2.11"]

[project.scripts]
jobrank = "jobrank.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:jobrank.sources.markdown_table"]

[tool.pycodestyle]
max-line-length = 110
exclude = ".venv,.cache,__pycache__"
